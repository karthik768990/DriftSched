[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-drift-scheduler"
version = "0.1.0"
description = "A research prototype for exploring drift-aware quantum experiment scheduling."
readme = "README.md"
authors = [{ name = "Quantum Drift Scheduler Contributors" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
qcs = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_data: runs the priority calculation, scheduler or an evaluation pipeline on the real recorded dataset",
]

